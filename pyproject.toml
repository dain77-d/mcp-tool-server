[project]
name = "arxiv-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents search arXiv and read papers section by section"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3"]

[project.scripts]
arxiv-mcp = "arxiv_mcp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["arxiv_mcp"]
